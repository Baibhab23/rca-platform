version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: rca_platform
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_user -d rca_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  governance:
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql://rca_user:rca_pass@postgres:5432/rca_platform
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://rca_user:rca_pass@postgres:5432/rca_platform
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  anomaly:
    build:
      context: .
      dockerfile: services/anomaly/Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  rca:
    build:
      context: .
      dockerfile: services/rca/Dockerfile
    ports:
      - "8003:8003"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prescriptive:
    build:
      context: .
      dockerfile: services/prescriptive/Dockerfile
    ports:
      - "8004:8004"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  narrative:
    build:
      context: .
      dockerfile: services/narrative/Dockerfile
    ports:
      - "8005:8005"
    environment:
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      INGESTION_URL: http://ingestion:8001
      ANOMALY_URL: http://anomaly:8002
      RCA_URL: http://rca:8003
      PRESCRIPTIVE_URL: http://prescriptive:8004
      NARRATIVE_URL: http://narrative:8005
      GOVERNANCE_URL: http://governance:8006
    depends_on:
      - governance
      - ingestion
      - anomaly
      - rca
      - prescriptive
      - narrative

volumes:
  postgres_data:
